  <title id="title">Beispiel: Kalman-Glättung von Umfragepunkten</title>
  <desc id="desc">Fiktive Umfragepunkte und eine geglättete Kalman-Linie mit Unsicherheitsband. Das Band wird breiter, wenn längere Zeit keine Umfrage vorliegt.</desc>

