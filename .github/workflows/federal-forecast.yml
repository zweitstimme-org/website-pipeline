name: Federal Forecast

on:
  workflow_dispatch:
    inputs:
      election_date:
        description: "Bundestagswahl date (YYYY-MM-DD)"
        required: false
        default: "2029-02-25"
      force_refresh:
        description: "Run even if no newer poll is published"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 4 * * 0"

jobs:
  federal-forecast:
    runs-on: [self-hosted, heavy-r]
    timeout-minutes: 1440
    steps:
      - name: Checkout pipeline
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"

      - name: Install dependencies
        run: Rscript R/install.R

      - name: Check poll freshness and forecast window
        id: gate
        env:
          POLLING_API_BASE: https://api.zweitstimme.org
          FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'false' }}
        run: |
          if [ "${FORCE_REFRESH}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=force_refresh" >> "$GITHUB_OUTPUT"
            echo "details=[]" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/check_poll_freshness.py --mode federal --github-output "$GITHUB_OUTPUT"
          fi

      - name: Run federal forecast skeleton
        if: steps.gate.outputs.run == 'true'
        env:
          FEDERAL_MODEL_DIR: /mnt/cerfort/forecasts/prediction-2025
          ELECTION_DATE: ${{ github.event.inputs.election_date || '2029-02-25' }}
        run: Rscript federal-model/run_federal_forecast.R

      - name: Publish manifest
        if: steps.gate.outputs.run == 'true'
        env:
          WEBSITE_DEPLOY_TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${WEBSITE_DEPLOY_TOKEN}@github.com/zweitstimme-org/website-source.git" website-source || true
          bash scripts/publish_to_website.sh || true
