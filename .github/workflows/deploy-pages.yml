name: Deploy site preview

# Preview only: https://zweitstimme-org.github.io/website-pipeline/
# Does NOT touch zweitstimme.org.
#
# Full Hugo rebuild (local):
#   ./scripts/deploy_pages_preview.sh
# Daily data refresh (GitHub Actions → gh-pages data/):
#   Daily Stimmung / State Forecasts call scripts/publish_to_pages_preview.sh
# This workflow then publishes the gh-pages tree via Actions Pages.
#
# Pages source is GitHub Actions (Settings → Pages). Do not also enable
# "Deploy from a branch": that starts pages-build-deployment on every
# gh-pages push and the two deploys fail with "in progress deployment".

on:
  workflow_dispatch:
  push:
    branches: [gh-pages]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Do not cancel a deploy mid-flight. A cancelled actions/deploy-pages
  # run can leave a Pages deployment in progress and block the next one.
  cancel-in-progress: false

jobs:
  build:
    name: Upload prebuilt preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages (prebuilt Hugo output)
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  # deploy-pages lists artifacts as soon as it starts. In the same job as
  # the upload, that list is often still empty (actions/deploy-pages#451).
  deploy:
    name: Deploy prebuilt preview
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
